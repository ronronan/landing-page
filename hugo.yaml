baseURL: https://3rm.fr/
locale: fr-fr
title: Blog de ronronan
theme: PaperMod
paginate: 5

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Blog de ronronan
  description: "ronronan's blog"
  keywords: [Blog, Portfolio, Landing Page]
  author: ronronan
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: false
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  profileMode:
    enabled: true
    title: Bienvenue sur mon blog
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags

  socialIcons:
    - name: "linkedin"
      url: "https://www.linkedin.com/in/morelronan/"
    - name: "github"
      url: "https://github.com/ronronan"
    - name: "gitlab"
      url: "https://gitlab.com/ronronan"
